<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CarShop Iluminación & Detailing</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- HEADER Y CONTACTO -->
  <header class="hero-header">
    <div class="hero-content">
      <h1>CarShop Iluminación</h1>
      <p class="subtitle">Detailing, Iluminación LED & Accesorios Automotrices</p>
      
      <div class="contact-bar">
        <span>📲 Consultas directas: </span>
        <a id="header-whatsapp-link" href="#" target="_blank" class="contact-phone">+54 9 297 000-0000</a>
      </div>
    </div>

    <!-- BOTÓN DE CARRITO -->
    <button id="btn-abrir-carrito" class="btn-carrito-badge">
      🛒 Carrito <span id="cart-count" class="cart-count">0</span>
    </button>
  </header>

  <main class="container-client">
    
    <!-- BUSCADOR EN TIEMPO REAL -->
    <section class="search-section">
      <input type="text" id="input-buscador" placeholder="🔍 Buscar productos o servicios (ej: Kit LED, Pulido)...">
    </section>

    <!-- CATÁLOGO -->
    <section class="client-section">
      <h2 class="section-title">Nuestros Productos y Servicios</h2>
      <div id="catalogo-grid" class="catalogo-grid">
        <p class="loading-text">Cargando catálogo en tiempo real...</p>
      </div>
    </section>

    <!-- COTIZADOR DE PRESUPUESTO PERSONALIZADO -->
    <section class="client-section cotizador-section">
      <h2 class="section-title">Solicitar Presupuesto Personalizado</h2>
      <form id="form-cotizador" class="card-form cotizador-form">
        <div class="form-group">
          <label for="cotiz-marca">Marca del Vehículo</label>
          <input type="text" id="cotiz-marca" required placeholder="Ej: Volkswagen">
        </div>
        <div class="form-group">
          <label for="cotiz-modelo">Modelo y Año</label>
          <input type="text" id="cotiz-modelo" required placeholder="Ej: Gol Trend 2015">
        </div>
        <div class="form-group">
          <label for="cotiz-servicio">Servicio o Producto Deseado</label>
          <select id="cotiz-servicio" required>
            <option value="">Seleccionar...</option>
            <option value="Instalación Kit LED">Instalación Kit LED</option>
            <option value="Pulido de Ópticas">Pulido de Ópticas</option>
            <option value="Detailing Completo">Detailing Completo</option>
            <option value="Tratamiento Cerámico">Tratamiento Cerámico</option>
            <option value="Consulta General / Reparación">Consulta General / Reparación</option>
          </select>
        </div>
        <div class="form-group full-width">
          <label for="cotiz-notas">Detalles o Especificaciones Adicionales</label>
          <textarea id="cotiz-notas" rows="3" placeholder="Ej: Luces LED para bajas y antinieblas..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary full-width btn-whatsapp">
          📲 Enviar Presupuesto por WhatsApp
        </button>
      </form>
    </section>
  </main>

  <!-- MODAL / DESPLEGABLE DEL CARRITO DE COMPRAS -->
  <div id="modal-carrito" class="modal-overlay hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>🛒 Tu Carrito de Compras</h3>
        <button id="btn-cerrar-carrito" class="btn-cerrar">&times;</button>
      </div>

      <div id="carrito-items" class="carrito-items">
        <!-- Se genera dinámicamente con JS -->
      </div>

      <div class="modal-footer">
        <div class="total-row">
          <span>Total estimado:</span>
          <strong id="carrito-total">$0</strong>
        </div>
        <button id="btn-checkout-whatsapp" class="btn btn-primary btn-whatsapp full-width">
          📲 Comprar / Enviar Pedido por WhatsApp
        </button>
      </div>
    </div>
  </div>

  <footer style="text-align: center; padding: 20px; margin-top: 40px;">
    <a href="admin.html" style="color: #666; text-decoration: none; font-size: 0.85rem;">Acceso Administrador</a>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
